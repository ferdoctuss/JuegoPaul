<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="icono3.png" sizes="any">
    <link rel="apple-touch-icon" href="icono3.png">
    <link rel="shortcut icon" href="icono3.png">
    
    <title>FRUTAS</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            user-select: none;
            position: relative;
            touch-action: manipulation; 
            overscroll-behavior-y: contain; 
        }
        
        #btn-config {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            padding: 8px 12px;
            background-color: #81ecec;
            color: #2d3436;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00cec9;
            transition: all 0.1s;
            font-weight: bold;
            touch-action: manipulation;
            display: none;
        }
        #btn-config:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #00cec9;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2.2rem;
            margin-bottom: 0px;
            margin-top: 35px;
        }
        
        #question-text {
            font-size: 2.8rem;
            color: #0984e3;
            margin: 25px 0;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        #apples-container {
            margin: 15px auto;
            max-width: 600px;
            min-height: 110px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .frutas-pocas { font-size: 4.5rem; }
        .frutas-medias { font-size: 3.8rem; }
        .frutas-muchas { font-size: 3.2rem; }

        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        button.opcion {
            font-size: 3rem;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 20px;
            background-color: #4ecdc4;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #00b894;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        button.opcion:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #00b894;
        }
        button.opcion:disabled {
            background-color: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
        }
        
        #message {
            font-size: 2.5rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 55px;
            opacity: 0;
        }

        #pantalla-inicio {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            gap: 20px;
        }
        #btn-iniciar {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 25px;
            background-color: #ff6b6b;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #ee5253;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        #btn-iniciar:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #ee5253;
        }
        .intro-titulo {
            font-size: 3rem;
            color: #0984e3;
            margin-bottom: 10px;
        }
        .intro-icono {
            font-size: 5rem;
        }

        #juego-container {
            display: none;
        }

        .progress-wrapper {
            width: 85%;
            max-width: 450px;
            margin: 25px auto 10px auto;
            text-align: center;
        }
        #progress-text {
            font-size: 1.1rem;
            color: #0984e3;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #progress-container {
            width: 100%;
            background-color: #dfe6e9;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            border: 3px solid #b2bec3;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b894, #00cec9);
            border-radius: 15px;
            transition: width 0.5s ease;
        }
        
        @keyframes reboteMagico {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animacion-exito {
            animation: reboteMagico 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animacion-error {
            opacity: 1 !important;
        }

        #modal-niveles {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 90%;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #2d3436;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .modal-botones-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .modal-botones-vertical button {
            font-size: 1.4rem;
            padding: 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: all 0.1s;
        }
        .btn-facil { background-color: #1dd1a1; box-shadow: 0 5px 0 #10ac84; }
        .btn-medio { background-color: #feca57; box-shadow: 0 5px 0 #ff9f43; color: #2d3436 !important; }
        .btn-dificil { background-color: #ff6b6b; box-shadow: 0 5px 0 #ee5253; }
        .modal-botones-vertical button:active { transform: translateY(5px); box-shadow: 0 0 0; }

        .btn-cancelar { 
            background-color: #b2bec3; 
            box-shadow: 0 4px 0 #636e72; 
            font-size: 1.2rem;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-cancelar:active { transform: translateY(4px); box-shadow: 0 0 0; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 {
                font-size: 1.5rem; 
                margin-top: 45px;  
            }
            #question-text {
                font-size: 2.1rem;
                margin: 20px 0;
            }
            .frutas-pocas { font-size: 3.3rem; }
            .frutas-medias { font-size: 2.6rem; }
            .frutas-muchas { font-size: 2.1rem; gap: 4px; }
            
            .options { gap: 10px; }
            button.opcion {
                font-size: 2rem;
                padding: 12px 18px;
                flex: 1; 
            }
            #message { font-size: 1.6rem; }
            .intro-titulo { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <div class="intro-icono">🍎🎮</div>
        <div class="intro-titulo">¡A Contar Frutas!</div>
        <button id="btn-iniciar" onclick="empezarJuego()">¡Iniciar Juego!</button>
    </div>

    <div id="juego-container">
        <button id="btn-config" onclick="abrirSelector()">⚙️</button>

        <h1 id="level-title">Nivel 1</h1>
        <div id="question-text" onclick="repetirPreguntaActual()">¿Cuántas frutas hay? 🤔</div>
        
        <div id="apples-container"></div>

        <div class="options" id="options-container"></div>
        <div id="message"></div>

        <div class="progress-wrapper">
            <div id="progress-text">Progreso: Nivel 1 de 100</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="modal-niveles">
        <div class="modal-content">
            <h3>Elige la dificultad</h3>
            <div class="modal-botones-vertical">
                <button class="btn-facil" onclick="seleccionarDificultad(1)">Fácil 😊 (1-30)</button>
                <button class="btn-medio" onclick="seleccionarDificultad(31)">Medio 😐 (31-60)</button>
                <button class="btn-dificil" onclick="seleccionarDificultad(61)">Difícil 🥵 (61-100)</button>
            </div>
            <button class="btn-cancelar" onclick="cerrarSelector()">Cancelar</button>
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function (event) {
            if (event.scale !== 1) {
                event.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        let currentLevel = 1;
        const maxLevels = 100;
        
        const frutas = [
            { emoji: "🍎", pregunta: "¿Cuántas manzanas hay?" },
            { emoji: "🍌", pregunta: "¿Cuántos plátanos hay?" },
            { emoji: "🍊", pregunta: "¿Cuántas naranjas hay?" },
            { emoji: "🍉", pregunta: "¿Cuántas sandías hay?" },
            { emoji: "🍓", pregunta: "¿Cuántas fresas hay?" },
            { emoji: "🍇", pregunta: "¿Cuántas uvas hay?" },
            { emoji: "🍐", pregunta: "¿Cuántas peras hay?" },
            { emoji: "🍍", pregunta: "¿Cuántas piñas hay?" },
            { emoji: "🍒", pregunta: "¿Cuántas cerezas hay?" },
            { emoji: "🍑", pregunta: "¿Cuántos duraznos hay?" }
        ];

        let expectedNumber = 0;
        let lastNumber = 0; 
        let ultimaPreguntaTexto = "¿Cuántas frutas hay?";

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let textoLimpio = texto.replace(/[¿?¡!🤔]/g, '');
                let utterance = new SpeechSynthesisUtterance(textoLimpio);
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function repetirPreguntaActual() {
            hablar(ultimaPreguntaTexto);
        }

        function empezarJuego() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('juego-container').style.display = 'block';
            document.getElementById('btn-config').style.display = 'block';
            initGame();
        }

        function abrirSelector() {
            document.getElementById('modal-niveles').style.display = 'flex';
        }

        function cerrarSelector() {
            document.getElementById('modal-niveles').style.display = 'none';
        }

        function seleccionarDificultad(nivelInicio) {
            currentLevel = nivelInicio;
            cerrarSelector();
            playLevel();
        }

        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const questionText = document.getElementById('question-text');
            const applesDiv = document.getElementById('apples-container');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            messageDiv.className = "";
            messageDiv.textContent = "";

            let porcentaje = (currentLevel / maxLevels) * 100;
            progressBar.style.width = porcentaje + "%";
            progressText.textContent = `Progreso: Nivel ${currentLevel} de ${maxLevels}`;

            let frutaData = frutas[(currentLevel - 1) % frutas.length];
            
            questionText.textContent = frutaData.pregunta + " 🤔";
            ultimaPreguntaTexto = frutaData.pregunta;
            
            hablar(frutaData.pregunta);

            let min, max, dificultadText;
            if (currentLevel <= 30) {
                min = 1; max = 10;
                dificultadText = "Fácil 😊";
            } else if (currentLevel <= 60) {
                min = 10; max = 15;
                dificultadText = "Medio 😐";
            } else {
                min = 15; max = 20;
                dificultadText = "Difícil 🥵";
            }

            title.textContent = `Nivel ${currentLevel} (${dificultadText})`;

            do {
                expectedNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            } while (expectedNumber === lastNumber && (max - min) > 0); 
            lastNumber = expectedNumber;

            applesDiv.innerHTML = "";
            applesDiv.className = "";
            if (expectedNumber > 15) {
                applesDiv.classList.add("frutas-muchas");
            } else if (expectedNumber > 10) {
                applesDiv.classList.add("frutas-medias");
            } else {
                applesDiv.classList.add("frutas-pocas");
            }

            for (let i = 0; i < expectedNumber; i++) {
                applesDiv.innerHTML += `<span>${frutaData.emoji}</span>`;
            }

            let options = [expectedNumber];
            while (options.length < 3) {
                let variacion = Math.floor(Math.random() * 5) - 2; 
                let randomWrong = expectedNumber + variacion;
                
                if (randomWrong > 0 && randomWrong <= 25 && !options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }

            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(num => {
                const btn = document.createElement('button');
                btn.className = "opcion";
                btn.textContent = num;
                btn.onclick = () => checkAnswer(num);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedNumber) {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const buttons = Array.from(optionsDiv.children);

            if (selectedNumber === expectedNumber) {
                // Visualmente en pantalla solo dice "¡Muy bien!"
                messageDiv.textContent = `¡Muy bien! 🎉🚀`;
                messageDiv.style.color = "#1dd1a1";
                messageDiv.className = "animacion-exito";
                
                // Auditivamente el navegador dirá el número y "Pol" para que Android lo pronuncie bien
                hablar(`${selectedNumber}, muy bien Pol`);

                buttons.forEach(btn => btn.disabled = true);
                
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        endGame();
                    } else {
                        playLevel();
                    }
                }, 2200); 
            } else {
                messageDiv.textContent = "¡No! ❌";
                messageDiv.style.color = "#ff7675";
                messageDiv.className = "animacion-error";
                hablar("No");
            }
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.getElementById('question-text').textContent = "¡Completaste los 100 niveles!";
            document.getElementById('apples-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('progress-bar').style.width = "100%";
            document.getElementById('progress-text').textContent = "¡Completado al 100%!";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('btn-config').style.display = 'none';
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón contando!";
            messageDiv.style.color = "#ff9f43";
            messageDiv.className = "animacion-exito";
            
            hablar("¡Completaste todos los niveles, eres un campeón, Pol!");

            const restartBtn = document.createElement('button');
            restartBtn.className = "opcion";
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.onclick = () => {
                document.getElementById('btn-config').style.display = 'block';
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }
    </script>
</body>
</html>
