<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Contar Manzanas</title>
    <style>
        /* Estilos amigables y coloridos para niños */
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 30px;
            user-select: none; /* Evita que el texto se seleccione por accidente */
        }
        h1 {
            color: #ff6b6b;
            font-size: 3rem;
            margin-bottom: 10px;
        }
        #apples-container {
            font-size: 5rem; /* Manzanas grandes */
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            font-size: 3rem;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            background-color: #4ecdc4;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #00b894;
            transition: all 0.1s;
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #00b894;
        }
        button:disabled {
            background-color: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
        }
        #message {
            font-size: 2rem;
            margin-top: 30px;
            font-weight: bold;
            min-height: 45px;
        }
    </style>
</head>
<body>

    <h1 id="level-title">Nivel 1</h1>
    <div id="apples-container"></div>
    <div class="options" id="options-container"></div>
    <div id="message"></div>

    <script>
        let currentLevel = 1;
        const maxLevels = 3;
        let expectedNumber = 0;

        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const applesDiv = document.getElementById('apples-container');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');

            messageDiv.textContent = "";
            title.textContent = `Nivel ${currentLevel}`;

            // Determinar cuántas manzanas mostrar según el nivel
            let min = 1, max = 3;
            if (currentLevel === 2) { min = 4; max = 6; }
            else if (currentLevel === 3) { min = 7; max = 10; }

            expectedNumber = Math.floor(Math.random() * (max - min + 1)) + min;

            // Dibujar las manzanas en pantalla
            applesDiv.innerHTML = "";
            for (let i = 0; i < expectedNumber; i++) {
                applesDiv.innerHTML += "<span>🍎</span>";
            }

            // Crear las opciones de respuesta (1 correcta, 2 incorrectas)
            let options = [expectedNumber];
            while (options.length < 3) {
                // Genera una respuesta falsa entre 1 y 12
                let randomWrong = Math.floor(Math.random() * 12) + 1;
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }

            // Desordenar los botones para que la respuesta correcta no siempre esté en el mismo lugar
            options.sort(() => Math.random() - 0.5);

            // Generar los botones HTML
            optionsDiv.innerHTML = "";
            options.forEach(num => {
                const btn = document.createElement('button');
                btn.textContent = num;
                btn.onclick = () => checkAnswer(num);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedNumber) {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const buttons = Array.from(optionsDiv.children);

            if (selectedNumber === expectedNumber) {
                messageDiv.textContent = "¡Muy bien! 🎉";
                messageDiv.style.color = "#1dd1a1";
                
                // Deshabilitar botones para evitar que siga haciendo clic
                buttons.forEach(btn => btn.disabled = true);
                
                // Esperar 1.5 segundos antes de pasar al siguiente nivel
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        endGame();
                    } else {
                        playLevel();
                    }
                }, 1500);
            } else {
                messageDiv.textContent = "¡Intenta de nuevo! 💪";
                messageDiv.style.color = "#ff7675";
            }
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Ganaste!";
            document.getElementById('apples-container').innerHTML = "🏆🥳✨";
            document.getElementById('options-container').innerHTML = "";
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Excelente trabajo contando!";
            messageDiv.style.color = "#ff9f43";
            
            // Botón para volver a empezar
            const restartBtn = document.createElement('button');
            restartBtn.textContent = "Jugar otra vez";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.onclick = initGame;
            document.getElementById('options-container').appendChild(restartBtn);
        }

        // Arrancar el juego por primera vez
        initGame();
    </script>
</body>
</html>
