<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta línea bloquea el zoom táctil (pellizco) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Contar Frutas para Paul</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            user-select: none;
            position: relative;
            /* Esta línea bloquea el zoom por doble toque */
            touch-action: manipulation; 
        }
        
        #btn-config {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            padding: 8px 12px;
            background-color: #81ecec;
            color: #2d3436;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00cec9;
            transition: all 0.1s;
            font-weight: bold;
            touch-action: manipulation;
        }
        #btn-config:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #00cec9;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            margin-bottom: 5px;
            margin-top: 40px;
        }
        .question-text {
            font-size: 2.2rem;
            color: #0984e3;
            margin: 15px 0;
            font-weight: bold;
        }
        
        /* Contenedor de frutas */
        #apples-container {
            margin: 20px auto;
            max-width: 600px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        /* Clases para el tamaño de las frutas manejadas por CSS */
        .frutas-pocas { font-size: 4.5rem; }
        .frutas-medias { font-size: 3.8rem; }
        .frutas-muchas { font-size: 3.2rem; }

        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button.opcion {
            font-size: 3rem;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 20px;
            background-color: #4ecdc4;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #00b894;
            transition: all 0.1s;
            touch-action: manipulation; /* Bloquea doble toque en botones */
        }
        button.opcion:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #00b894;
        }
        button.opcion:disabled {
            background-color: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
        }
        
        #message {
            font-size: 2.5rem;
            margin-top: 20px;
            font-weight: bold;
            min-height: 55px;
            opacity: 0;
        }
        
        @keyframes reboteMagico {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animacion-exito {
            animation: reboteMagico 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animacion-error {
            opacity: 1 !important;
        }

        /* Estilos de la ventana modal */
        #modal-niveles {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 90%;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #2d3436;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .modal-botones-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .modal-botones-vertical button {
            font-size: 1.4rem;
            padding: 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: all 0.1s;
        }
        .btn-facil { background-color: #1dd1a1; box-shadow: 0 5px 0 #10ac84; }
        .btn-medio { background-color: #feca57; box-shadow: 0 5px 0 #ff9f43; color: #2d3436 !important; }
        .btn-dificil { background-color: #ff6b6b; box-shadow: 0 5px 0 #ee5253; }
        .modal-botones-vertical button:active { transform: translateY(5px); box-shadow: 0 0 0; }

        .btn-cancelar { 
            background-color: #b2bec3; 
            box-shadow: 0 4px 0 #636e72; 
            font-size: 1.2rem;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-cancelar:active { transform: translateY(4px); box-shadow: 0 0 0; }

        /* =========================================
           MEDIA QUERIES (Ajustes para teléfonos)
           ========================================= */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 1.7rem; /* Evita que el título se rompa en dos líneas */
                margin-top: 55px;  /* Da más espacio para el botón de engranaje */
            }
            .question-text {
                font-size: 1.6rem;
                margin: 10px 0;
            }
            /* Reducimos el tamaño de las frutas en móviles para que quepan mejor */
            .frutas-pocas { font-size: 3.5rem; }
            .frutas-medias { font-size: 2.8rem; }
            .frutas-muchas { font-size: 2.2rem; gap: 4px; }
            
            .options {
                gap: 10px;
            }
            button.opcion {
                font-size: 2.2rem;
                padding: 15px 20px;
                flex: 1; /* Hace que los 3 botones se distribuyan el espacio equitativamente */
            }
            #message {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <button id="btn-config" onclick="abrirSelector()">⚙️ Niveles</button>

    <h1 id="level-title">Nivel 1</h1>
    <div class="question-text">¿Cuántas frutas hay? 🤔</div>
    
    <!-- Eliminé los estilos en línea de JS y ahora usamos clases CSS -->
    <div id="apples-container"></div>
    
    <div class="options" id="options-container"></div>
    <div id="message"></div>

    <div id="modal-niveles">
        <div class="modal-content">
            <h3>Elige la dificultad</h3>
            <div class="modal-botones-vertical">
                <button class="btn-facil" onclick="seleccionarDificultad(1)">Fácil 😊 (1-10)</button>
                <button class="btn-medio" onclick="seleccionarDificultad(31)">Medio 😐 (10-15)</button>
                <button class="btn-dificil" onclick="seleccionarDificultad(61)">Difícil 🥵 (15-20)</button>
            </div>
            <button class="btn-cancelar" onclick="cerrarSelector()">Cancelar</button>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        const maxLevels = 100;
        const frutas = ["🍎", "🍌", "🍊", "🍉", "🍓", "🍇", "🍐", "🍍", "🍒", "🍑"];

        let expectedNumber = 0;
        let lastNumber = 0; 

        function abrirSelector() {
            document.getElementById('modal-niveles').style.display = 'flex';
        }

        function cerrarSelector() {
            document.getElementById('modal-niveles').style.display = 'none';
        }

        function seleccionarDificultad(nivelInicio) {
            currentLevel = nivelInicio;
            cerrarSelector();
            playLevel();
        }

        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const applesDiv = document.getElementById('apples-container');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');

            messageDiv.className = "";
            messageDiv.textContent = "";

            let frutaActual = frutas[(currentLevel - 1) % frutas.length];

            let min, max, dificultadText;
            if (currentLevel <= 30) {
                min = 1; max = 10;
                dificultadText = "Fácil 😊";
            } else if (currentLevel <= 60) {
                min = 10; max = 15;
                dificultadText = "Medio 😐";
            } else {
                min = 15; max = 20;
                dificultadText = "Difícil 🥵";
            }

            title.textContent = `Nivel ${currentLevel} (${dificultadText})`;

            do {
                expectedNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            } while (expectedNumber === lastNumber && (max - min) > 0); 
            lastNumber = expectedNumber;

            applesDiv.innerHTML = "";
            
            // Ahora aplicamos clases de CSS en lugar de estilos en línea
            applesDiv.className = "";
            if (expectedNumber > 15) {
                applesDiv.classList.add("frutas-muchas");
            } else if (expectedNumber > 10) {
                applesDiv.classList.add("frutas-medias");
            } else {
                applesDiv.classList.add("frutas-pocas");
            }

            for (let i = 0; i < expectedNumber; i++) {
                applesDiv.innerHTML += `<span>${frutaActual}</span>`;
            }

            let options = [expectedNumber];
            while (options.length < 3) {
                let variacion = Math.floor(Math.random() * 5) - 2; 
                let randomWrong = expectedNumber + variacion;
                
                if (randomWrong > 0 && randomWrong <= 25 && !options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }

            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(num => {
                const btn = document.createElement('button');
                btn.className = "opcion";
                btn.textContent = num;
                btn.onclick = () => checkAnswer(num);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedNumber) {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const buttons = Array.from(optionsDiv.children);

            if (selectedNumber === expectedNumber) {
                messageDiv.textContent = "¡Muy bien Paul! 🎉🚀";
                messageDiv.style.color = "#1dd1a1";
                messageDiv.className = "animacion-exito";
                
                buttons.forEach(btn => btn.disabled = true);
                
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        endGame();
                    } else {
                        playLevel();
                    }
                }, 1800); 
            } else {
                messageDiv.textContent = "¡Casi, prueba otro! 💪";
                messageDiv.style.color = "#ff7675";
                messageDiv.className = "animacion-error";
            }
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.querySelector('.question-text').textContent = "¡Completaste los 100 niveles!";
            document.getElementById('apples-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('btn-config').style.display = 'none';
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón contando, Paul!";
            messageDiv.style.color = "#ff9f43";
            messageDiv.className = "animacion-exito";
            
            const restartBtn = document.createElement('button');
            restartBtn.className = "opcion";
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.onclick = () => {
                document.querySelector('.question-text').textContent = "¿Cuántas frutas hay? 🤔";
                document.getElementById('btn-config').style.display = 'block';
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }

        initGame();
    </script>
</body>
</html>
