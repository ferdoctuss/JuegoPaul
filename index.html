<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Contar Frutas para Paul</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .question-text {
            font-size: 2.2rem;
            color: #0984e3;
            margin: 15px 0;
            font-weight: bold;
        }
        #apples-container {
            font-size: 4rem;
            margin: 20px auto;
            max-width: 600px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            font-size: 3rem;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 20px;
            background-color: #4ecdc4;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #00b894;
            transition: all 0.1s;
        }
        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #00b894;
        }
        button:disabled {
            background-color: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
        }
        #message {
            font-size: 2.5rem;
            margin-top: 20px;
            font-weight: bold;
            min-height: 55px;
            opacity: 0; /* Oculto por defecto */
        }
        
        /* Animación para el mensaje de éxito */
        @keyframes reboteMagico {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animacion-exito {
            animation: reboteMagico 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animacion-error {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <h1 id="level-title">Nivel 1</h1>
    <div class="question-text">¿Cuántas frutas hay? 🤔</div>
    <div id="apples-container"></div>
    <div class="options" id="options-container"></div>
    <div id="message"></div>

    <script>
        let currentLevel = 1;
        const maxLevels = 100;
        const frutas = ["🍎", "🍌", "🍊", "🍉", "🍓", "🍇", "🍐", "🍍", "🍒", "🍑"];

        let expectedNumber = 0;
        let lastNumber = 0; // Para evitar que se repita el mismo número dos veces seguidas

        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const applesDiv = document.getElementById('apples-container');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');

            // Reiniciar el mensaje y quitar la animación
            messageDiv.className = "";
            messageDiv.textContent = "";
            title.textContent = `Nivel ${currentLevel}`;

            // Seleccionar fruta rotando para asegurar que vea las 10
            let frutaActual = frutas[(currentLevel - 1) % frutas.length];

            // Generar un número aleatorio entre 1 y 30 que no sea igual al del nivel anterior
            do {
                expectedNumber = Math.floor(Math.random() * 30) + 1;
            } while (expectedNumber === lastNumber);
            lastNumber = expectedNumber;

            // Dibujar las frutas ajustando tamaño si son demasiadas
            applesDiv.innerHTML = "";
            if (expectedNumber > 20) {
                applesDiv.style.fontSize = "2.5rem";
            } else if (expectedNumber > 10) {
                applesDiv.style.fontSize = "3.2rem";
            } else {
                applesDiv.style.fontSize = "4.5rem";
            }

            for (let i = 0; i < expectedNumber; i++) {
                applesDiv.innerHTML += `<span>${frutaActual}</span>`;
            }

            // Crear las alternativas (1 correcta, 2 incorrectas cercanas)
            let options = [expectedNumber];
            while (options.length < 3) {
                let variacion = Math.floor(Math.random() * 7) - 3; // Variación entre -3 y +3
                let randomWrong = expectedNumber + variacion;
                
                // Asegurarse de que las opciones falsas estén entre 1 y 30
                if (randomWrong > 0 && randomWrong <= 30 && !options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }

            // Desordenar los botones
            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(num => {
                const btn = document.createElement('button');
                btn.textContent = num;
                btn.onclick = () => checkAnswer(num);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedNumber) {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const buttons = Array.from(optionsDiv.children);

            if (selectedNumber === expectedNumber) {
                // Activar animación y mensaje para Paul
                messageDiv.textContent = "¡Muy bien Paul! 🎉🚀";
                messageDiv.style.color = "#1dd1a1";
                messageDiv.className = "animacion-exito";
                
                buttons.forEach(btn => btn.disabled = true);
                
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        endGame();
                    } else {
                        playLevel();
                    }
                }, 1800); // Le damos un poquito más de tiempo (1.8s) para que disfrute su nombre animado
            } else {
                messageDiv.textContent = "¡Casi, prueba otro! 💪";
                messageDiv.style.color = "#ff7675";
                messageDiv.className = "animacion-error";
            }
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.querySelector('.question-text').textContent = "¡Completaste los 100 niveles!";
            document.getElementById('apples-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('options-container').innerHTML = "";
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón contando, Paul!";
            messageDiv.style.color = "#ff9f43";
            messageDiv.className = "animacion-exito";
            
            const restartBtn = document.createElement('button');
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.onclick = () => {
                document.querySelector('.question-text').textContent = "¿Cuántas frutas hay? 🤔";
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }

        initGame();
    </script>
</body>
</html>
