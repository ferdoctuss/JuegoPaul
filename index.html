<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Contar Frutas para Paul</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            text-align: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
            user-select: none;
            position: relative;
        }
        
        /* Botón de configuración pequeño y discreto */
        #btn-config {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            padding: 8px 12px;
            background-color: #81ecec;
            color: #2d3436;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00cec9;
            transition: all 0.1s;
            font-weight: bold;
        }
        #btn-config:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #00cec9;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            margin-bottom: 5px;
            margin-top: 40px; /* Espacio para que no choque con el botón */
        }
        .question-text {
            font-size: 2.2rem;
            color: #0984e3;
            margin: 15px 0;
            font-weight: bold;
        }
        #apples-container {
            font-size: 4rem;
            margin: 20px auto;
            max-width: 600px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button.opcion {
            font-size: 3rem;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 20px;
            background-color: #4ecdc4;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #00b894;
            transition: all 0.1s;
        }
        button.opcion:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #00b894;
        }
        button.opcion:disabled {
            background-color: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
        }
        #message {
            font-size: 2.5rem;
            margin-top: 20px;
            font-weight: bold;
            min-height: 55px;
            opacity: 0;
        }
        
        @keyframes reboteMagico {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animacion-exito {
            animation: reboteMagico 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animacion-error {
            opacity: 1 !important;
        }

        /* Estilos de la ventana modal (Selector de niveles) */
        #modal-niveles {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 300px;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #2d3436;
            font-size: 1.5rem;
        }
        .modal-content input {
            font-size: 1.5rem;
            width: 80px;
            text-align: center;
            padding: 5px;
            border: 2px solid #0984e3;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .modal-botones {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-botones button {
            font-size: 1.2rem;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-ir { background-color: #0984e3; box-shadow: 0 4px 0 #005f9e; }
        .btn-cancelar { background-color: #d63031; box-shadow: 0 4px 0 #b33939; }
        .modal-botones button:active { transform: translateY(4px); box-shadow: 0 0 0; }
    </style>
</head>
<body>

    <button id="btn-config" onclick="abrirSelector()">⚙️ Niveles</button>

    <h1 id="level-title">Nivel 1</h1>
    <div class="question-text">¿Cuántas frutas hay? 🤔</div>
    <div id="apples-container"></div>
    <div class="options" id="options-container"></div>
    <div id="message"></div>

    <div id="modal-niveles">
        <div class="modal-content">
            <h3>Ir a un nivel</h3>
            <p>Escribe un número del 1 al 100:</p>
            <input type="number" id="input-nivel" min="1" max="100" value="1">
            <div class="modal-botones">
                <button class="btn-cancelar" onclick="cerrarSelector()">Cancelar</button>
                <button class="btn-ir" onclick="saltarANivel()">¡Ir!</button>
            </div>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        const maxLevels = 100;
        const frutas = ["🍎", "🍌", "🍊", "🍉", "🍓", "🍇", "🍐", "🍍", "🍒", "🍑"];

        let expectedNumber = 0;
        let lastNumber = 0; 

        // Funciones del Selector de Niveles
        function abrirSelector() {
            document.getElementById('modal-niveles').style.display = 'flex';
            document.getElementById('input-nivel').value = currentLevel;
        }

        function cerrarSelector() {
            document.getElementById('modal-niveles').style.display = 'none';
        }

        function saltarANivel() {
            let nivelDeseado = parseInt(document.getElementById('input-nivel').value);
            if (nivelDeseado >= 1 && nivelDeseado <= 100) {
                currentLevel = nivelDeseado;
                cerrarSelector();
                playLevel();
            } else {
                alert("Por favor, ingresa un número entre 1 y 100.");
            }
        }

        // Lógica principal del juego
        function initGame() {
            currentLevel = 1;
            playLevel();
        }

        function playLevel() {
            const title = document.getElementById('level-title');
            const applesDiv = document.getElementById('apples-container');
            const optionsDiv = document.getElementById('options-container');
            const messageDiv = document.getElementById('message');

            messageDiv.className = "";
            messageDiv.textContent = "";

            // Seleccionar fruta rotando
            let frutaActual = frutas[(currentLevel - 1) % frutas.length];

            // Configurar dificultad según el nivel solicitado
            let min, max, dificultadText;
            if (currentLevel <= 30) {
                min = 1; max = 10;
                dificultadText = "Fácil 😊";
            } else if (currentLevel <= 60) {
                min = 10; max = 15;
                dificultadText = "Medio 😐";
            } else {
                min = 15; max = 20;
                dificultadText = "Difícil 🥵";
            }

            title.textContent = `Nivel ${currentLevel} (${dificultadText})`;

            // Generar número aleatorio evitando repetir
            do {
                expectedNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            } while (expectedNumber === lastNumber && (max - min) > 0); 
            lastNumber = expectedNumber;

            applesDiv.innerHTML = "";
            // Ajustar el tamaño si son muchas frutas
            if (expectedNumber > 15) {
                applesDiv.style.fontSize = "3.2rem";
            } else if (expectedNumber > 10) {
                applesDiv.style.fontSize = "3.8rem";
            } else {
                applesDiv.style.fontSize = "4.5rem";
            }

            for (let i = 0; i < expectedNumber; i++) {
                applesDiv.innerHTML += `<span>${frutaActual}</span>`;
            }

            // Crear alternativas (1 correcta, 2 incorrectas)
            let options = [expectedNumber];
            while (options.length < 3) {
                let variacion = Math.floor(Math.random() * 7) - 3; 
                let randomWrong = expectedNumber + variacion;
                
                // Asegurar que las opciones falsas estén dentro del rango visualógico de 1 a 25
                if (randomWrong > 0 && randomWrong <= 25 && !options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }

            options.sort(() => Math.random() - 0.5);

            optionsDiv.innerHTML = "";
            options.forEach(num => {
                const btn = document.createElement('button');
                btn.className = "opcion";
                btn.textContent = num;
                btn.onclick = () => checkAnswer(num);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedNumber) {
            const messageDiv = document.getElementById('message');
            const optionsDiv = document.getElementById('options-container');
            const buttons = Array.from(optionsDiv.children);

            if (selectedNumber === expectedNumber) {
                messageDiv.textContent = "¡Muy bien Paul! 🎉🚀";
                messageDiv.style.color = "#1dd1a1";
                messageDiv.className = "animacion-exito";
                
                buttons.forEach(btn => btn.disabled = true);
                
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > maxLevels) {
                        endGame();
                    } else {
                        playLevel();
                    }
                }, 1800); 
            } else {
                messageDiv.textContent = "¡Casi, prueba otro! 💪";
                messageDiv.style.color = "#ff7675";
                messageDiv.className = "animacion-error";
            }
        }

        function endGame() {
            document.getElementById('level-title').textContent = "¡Lo lograste!";
            document.querySelector('.question-text').textContent = "¡Completaste los 100 niveles!";
            document.getElementById('apples-container').innerHTML = "🏆👑🥳✨";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('btn-config').style.display = 'none';
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "¡Eres un campeón contando, Paul!";
            messageDiv.style.color = "#ff9f43";
            messageDiv.className = "animacion-exito";
            
            const restartBtn = document.createElement('button');
            restartBtn.className = "opcion";
            restartBtn.textContent = "Jugar de nuevo";
            restartBtn.style.backgroundColor = "#0984e3";
            restartBtn.style.boxShadow = "0 6px 0 #005f9e";
            restartBtn.onclick = () => {
                document.querySelector('.question-text').textContent = "¿Cuántas frutas hay? 🤔";
                document.getElementById('btn-config').style.display = 'block';
                initGame();
            };
            document.getElementById('options-container').appendChild(restartBtn);
        }

        // Arrancar el juego
        initGame();
    </script>
</body>
</html>
